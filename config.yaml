## Primary production model:
## 1. Run `sentinel.cli cron-run` from an external cron/systemd timer.
## 2. Run `sentinel.cli feedback-service` as a separate always-on service for
##    Telegram TP/FP capture plus Karpathy learning.
##
## Important: `schedule.pipeline_cron` and `schedule.timezone` are consumed by
## the legacy in-app `sentinel.cli scheduler` process. They do not change the
## host timezone for an external EC2 crontab. If using system cron, set the EC2
## timezone with `sudo timedatectl set-timezone America/Vancouver` or convert
## the crontab expression to the server timezone.
##
## Primary operator knobs live in two sections:
## - `schedule`: when the pipeline and learner run
## - `workflow`: how many feed/article items are stored and alerted per run
##
## For a typical daily setup, most operators only need to change:
## - `schedule.pipeline_cron`
## - `schedule.daily_digest_cron`
## - `schedule.karpathy_loop_cron`
## - `workflow.feed_ioc_store_limit_per_run`
## - `workflow.feed_article_store_limit_per_run`
## - `workflow.discovery_article_store_limit_per_run`
## - `workflow.telegram_feed_alert_limit_per_run`
## - `workflow.telegram_feed_article_alert_limit_per_run`
## - `workflow.telegram_discovery_article_alert_limit_per_run`

schedule:
  # Fallback cadence used only when `pipeline_cron` is blank.
  scrape_interval_hours: 4
  # Legacy in-app scheduler scrape/store/alert schedule.
  pipeline_cron: "5 0 * * *"
  # Legacy fallback used only when `daily_digest_cron` is blank.
  daily_digest_time: "07:00"
  # Optional separate digest message schedule.
  daily_digest_cron: "5 7 * * *"
  # Legacy in-app scheduler timezone. External cron uses the host cron timezone.
  timezone: "America/Vancouver"
  karpathy_loop_day: "sunday"
  # Used by `feedback-service` when Karpathy scheduling is enabled.
  karpathy_loop_cron: "0 3 * * 0"
  enable_karpathy_job: false
  karpathy_loop_type: "source"

workflow:
  # How many feed-origin IOCs are allowed into the DB each cron run.
  feed_ioc_store_limit_per_run: 3
  # How many article/writeups from configured source feeds are allowed into
  # the DB each cron run. These are RSS/blog entries from `sources.feeds`.
  # Keep this higher than the Telegram send budget so already-sent/labeled
  # article IOCs do not starve the curated article alert slot.
  feed_article_store_limit_per_run: 3
  # How many discovery/open-web articles are allowed into the DB each cron run.
  # These come from `discovery.profiles[*].feeds` and `search_providers`.
  # Keep this higher than the Telegram send budget so already-sent/labeled
  # article IOCs do not starve the discovery article alert slot.
  discovery_article_store_limit_per_run: 3
  # Legacy pooled article/writeup DB budget. Used only when the two split
  # article store limits above are omitted from config.
  article_store_limit_per_run: 1
  # Telegram delivery budget for feed-origin alerts per cron run.
  telegram_feed_alert_limit_per_run: 3
  # Telegram delivery budget for configured-feed article/writeup alerts.
  telegram_feed_article_alert_limit_per_run: 1
  # Telegram delivery budget for discovery/open-web article alerts.
  telegram_discovery_article_alert_limit_per_run: 1
  # Legacy pooled article/writeup Telegram budget. Used only when the two split
  # article Telegram limits above are omitted from config.
  telegram_article_alert_limit_per_run: 1
  # Optional per-type Telegram budgets inside the feed alert budget.
  telegram_type_limits_per_run:
    ipv4: 1
    domain: 1
    hash: 1
  # Optional per-type DB store budgets inside the feed IOC store budget.
  store_type_limits_per_run:
    ipv4: 1
    domain: 1
    hash: 1

thresholds:
  alert_score: 38
  # Backstop for learning: if no normal immediate alert qualifies, promote
  # fresh trusted-feed candidates above this score so TP/FP feedback still flows.
  feedback_candidate_score: 18
  digest_score: 25
  digest_backfill_score: 20
  curated_immediate_score: 28
  corroborated_immediate_score: 32
  curated_digest_score: 20
  rule_score: 30
  karpathy_experiments: 25
  karpathy_budget_mins: 30

sources:
  otx_api_key: ${OTX_API_KEY}
  threatfox_api_key: ${THREATFOX_API_KEY}
  malwarebazaar_api_key: ${MALWAREBAZAAR_API_KEY}
  phishtank_app_key: ${PHISHTANK_APP_KEY}
  max_item_age_hours: 24
  writeup_max_item_age_hours: 72
  http_timeout_seconds: 60
  mix:
    enabled: true
    max_items_per_source: 150
  writeup_search:
    enabled: true
    terms:
      - phishing
      - malware
      - stealer
      - ransomware
      - loader
      - backdoor
      - campaign
      - c2
      - ioc
      - iocs
      - indicator
      - indicators
      - hash
      - payload
    max_candidates_per_source: 5
    fetch_budget_seconds: 60
  feeds:
    - name: threatfox
      url: https://threatfox-api.abuse.ch/api/v1/
      trust: 0.94
      enabled: true
    - name: urlhaus
      url: https://urlhaus.abuse.ch/downloads/csv_recent/
      trust: 0.91
      enabled: true
    - name: tweetfeed
      url: https://api.tweetfeed.live/v1/week
      trust: 0.62
      enabled: true
    - name: openphish
      url: https://raw.githubusercontent.com/openphish/public_feed/refs/heads/main/feed.txt
      trust: 0.82
      enabled: true
    - name: feodotracker
      url: https://feodotracker.abuse.ch/downloads/ipblocklist.json
      trust: 0.93
      enabled: true
    - name: otx
      url: https://otx.alienvault.com/api/v1/pulses/subscribed
      trust: 0.90
      enabled: true
    - name: malwarebazaar
      url: https://mb-api.abuse.ch/api/v1/
      trust: 0.92
      enabled: true
    - name: phishtank
      url: https://data.phishtank.com/data/online-valid.json
      trust: 0.88
      enabled: true
    - name: talos_blog
      url: https://blog.talosintelligence.com/feed/
      trust: 0.68
      enabled: true
    - name: google_cloud_threat_intelligence
      url: https://feeds.feedburner.com/threatintelligence/pvexyqv7v0v
      trust: 0.70
      enabled: true
    - name: unit42_blog
      url: https://unit42.paloaltonetworks.com/feed/
      trust: 0.68
      enabled: true
    - name: securelist_blog
      url: https://securelist.com/feed/
      trust: 0.67
      enabled: true
    - name: sophos_threat_research
      url: https://www.sophos.com/en-us/category/threat-research/feed
      trust: 0.67
      enabled: true
    # SANS ISC diary alerts use source-specific IOC extraction reviewed against
    # live articles, including public-resolver suppression and full hostnames.
    - name: sans_isc_diary
      url: https://isc.sans.edu/rssfeed.xml
      trust: 0.68
      enabled: true
    # The official feed covers the whole blog. Keep only entries explicitly
    # categorized as Threat Research before fetching article pages.
    - name: reversinglabs_threat_research
      url: https://www.reversinglabs.com/blog/rss.xml
      trust: 0.67
      required_categories: [Threat Research]
      enabled: false
    # Check Point Research is wired as a curated writeup feed but disabled:
    # AWS WAF currently returns HTTP 202 (x-amzn-waf-action: challenge) with
    # an empty body to non-browser clients. Enable only after the runtime host
    # consistently receives HTTP 200 RSS XML and article pages are fetchable.
    - name: checkpoint_research
      url: https://research.checkpoint.com/feed/
      trust: 0.67
      enabled: false
    - name: crowdstrike_blog
      url: https://www.crowdstrike.com/blog/feed/
      trust: 0.67
      enabled: true
    - name: sentinelone_blog
      url: https://www.sentinelone.com/blog/feed/
      trust: 0.66
      enabled: true
    - name: rapid7_blog
      url: https://www.rapid7.com/blog/rss/
      trust: 0.66
      enabled: true
    - name: proofpoint_threat_insight
      url: https://www.proofpoint.com/us/threat-insight-blog.xml
      trust: 0.68
      enabled: true
    - name: dfir_report
      url: https://thedfirreport.com/feed/
      trust: 0.69
      enabled: true
    - name: elastic_security_labs
      url: https://www.elastic.co/security-labs/rss/feed.xml
      trust: 0.67
      enabled: true

discovery:
  # Additive analyst-style discovery pass. Runs inside the pipeline only when
  # enabled; `sentinel discover` runs it standalone for tuning either way.
  enabled: true
  blocked_article_false_positive_threshold: 1
  blocked_host_false_positive_threshold: 2
  blocked_host_max_score: 0.35
  profiles:
    - name: crimeware-fresh
      enabled: true
      keywords:
        - indicators of compromise
        - threat intelligence
        - threat report
        - malware analysis
        - c2
        - command and control
        - stealer
        - loader
        - ransomware
        - phishing
        - backdoor
        - malware
        - payload
        - cve
      # Open-web discovery only. Curated vendor RSS/blog sources belong in
      # `sources.feeds` and are blocked from this channel by DiscoveryAgent.
      feeds: []
      search_providers:
        - name: open_web_recent
          enabled: true
          provider: gdelt_doc
          base_url: https://api.gdeltproject.org/api/v2/doc/doc
          query_terms:
            - indicators of compromise
            - c2 infrastructure
            - command and control
            - malware analysis
            - threat intelligence
            - threat report
            - phishing
            - stealer
            - malware
            - ransomware
          max_queries: 4
          max_records: 15
          sort: datedesc
        - name: open_web_google_news
          enabled: true
          provider: google_news_rss
          base_url: https://news.google.com/rss/search
          query_terms:
            - '"indicators of compromise" malware'
            - '"indicators of compromise" ransomware'
            - '"indicators of compromise" stealer'
            - '"C2 infrastructure" malware'
            - '"malware analysis" "indicators of compromise"'
          max_queries: 5
          max_records: 15
      freshness_hours: 96
      max_candidates_per_source: 15
      max_pages_per_run: 8
      time_budget_seconds: 90
      per_page_timeout_seconds: 20
      require_ioc_section: true
      # Empty allowlist means Google/GDELT can discover any non-denied host.
      # Curated `sources.feeds` hosts are automatically denied in code so this
      # channel stays independent from hardcoded feed sources.
      allow_hosts: []
      deny_hosts: []
      source_trust: 0.60

enrichment:
  virustotal_key: ${VT_API_KEY}
  shodan_key: ${SHODAN_API_KEY}
  abuseipdb_key: ${ABUSEIPDB_API_KEY}
  enable_whois: false
  provider_timeout_seconds: 20
  batch_size: 50
  max_iocs_per_run: 250
  weights:
    vt_ratio: 0.20
    abuse_confidence: 0.20
    source_trust: 0.05
    recency: 0.05
    context: 0.30
    corroboration: 0.20

delivery:
  telegram_token: ${TELEGRAM_BOT_TOKEN}
  telegram_chat_id: ${TELEGRAM_CHAT_ID}
  enable_telegram_immediate_alerts: true
  telegram_max_alerts_per_run: 6
  # An IOC already alerted (immediate or digest) is not re-sent until this
  # many hours pass; the alert_events ledger enforces it across cron runs.
  alert_resend_after_hours: 72
  telegram_daily_digest_limit: 5
  telegram_digest_candidate_pool_size: 250
  enable_email: false
  sendgrid_key: ${SENDGRID_API_KEY}
  email_from: sentinel@yourdomain.com
  email_to:
    - analyst@yourdomain.com

retention:
  enabled: true
  # Run pruning automatically at the end of each cron-run after delivery.
  prune_on_cron: true
  # Feed-only IOCs that were never alerted or labeled are cheap context and can
  # be pruned aggressively to prevent DB bloat.
  unalerted_feed_ioc_ttl_days: 5
  # Alerted IOCs stay longer because they explain operator history and support
  # resend suppression / replay evaluation.
  alerted_ioc_ttl_days: 90
  # Article/writeup-linked IOCs stay longer because they carry campaign/source
  # context that helps scoring and Karpathy learning.
  article_ioc_ttl_days: 30
  # Feedback-labeled IOCs are the highest-value training examples.
  feedback_ioc_ttl_days: 180
  # Keep TP/FP/Needs Review rows indefinitely by default; set false to let
  # `feedback_ioc_ttl_days` eventually prune labeled examples.
  keep_feedback_labeled: true
  # Source material is retained longer than raw feed noise, but old unreferenced
  # articles are removed after this TTL.
  source_material_ttl_days: 30

anthropic:
  api_key: ${ANTHROPIC_API_KEY}
  model: claude-sonnet-4-20250514

openai:
  api_key: ${OPENAI_API_KEY}
  model: gpt-5.4
  base_url: ${OPENAI_BASE_URL}

mitre:
  stix_path: ${MITRE_STIX_PATH}

db:
  url: ${DATABASE_URL}
  redis_url: ${REDIS_URL}
  pool_pre_ping: true
  pool_recycle_seconds: 1800
  pool_size: 10
  max_overflow: 20

git:
  skills_repo_path: ./skills
  author_name: SENTINEL Learner
  author_email: sentinel@bot

karpathy:
  # Brier-based replay improvements are naturally small because the metric is an
  # average squared error on [0,1]. Keep this floor aligned to the observed
  # replay headroom while relying on min_labeled_samples and replay guardrails
  # to reject noisy changes.
  min_keep_delta: 0.001
  max_false_positive_increase: 0
  max_true_positive_drop: 0
  lease_ttl_seconds: 1800
  replay_window_hours: 336
  status_history_limit: 5
  # Fail closed below this many labeled IOCs in the replay window: with a
  # tiny labeled set, a metric delta is noise and no patch is kept.
  min_labeled_samples: 20
