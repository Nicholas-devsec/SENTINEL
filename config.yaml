schedule:
  scrape_interval_hours: 4
  pipeline_cron: "0 7 * * *"
  daily_digest_time: "07:00"
  daily_digest_cron: "5 7 * * *"
  timezone: "America/Vancouver"
  karpathy_loop_day: "sunday"
  karpathy_loop_cron: "0 3 * * 0"
  enable_karpathy_job: false
  karpathy_loop_type: "source"

workflow:
  feed_ioc_store_limit_per_run: 250
  article_store_limit_per_run: 5
  telegram_feed_alert_limit_per_run: 5
  telegram_article_alert_limit_per_run: 2

thresholds:
  alert_score: 70
  rule_score: 30
  karpathy_experiments: 25
  karpathy_budget_mins: 30

sources:
  otx_api_key: ${OTX_API_KEY}
  threatfox_api_key: ${THREATFOX_API_KEY}
  malwarebazaar_api_key: ${MALWAREBAZAAR_API_KEY}
  phishtank_app_key: ${PHISHTANK_APP_KEY}
  max_item_age_hours: 24
  writeup_max_item_age_hours: 72
  http_timeout_seconds: 60
  mix:
    enabled: true
    max_items_per_source: 150
  writeup_search:
    enabled: true
    terms:
      - phishing
      - malware
      - stealer
      - ransomware
      - loader
      - backdoor
      - campaign
      - c2
      - ioc
      - iocs
      - indicator
      - indicators
      - hash
      - payload
    max_candidates_per_source: 5
    fetch_budget_seconds: 60
  feeds:
    - name: threatfox
      url: https://threatfox-api.abuse.ch/api/v1/
      trust: 0.94
      enabled: true
    - name: urlhaus
      url: https://urlhaus.abuse.ch/downloads/csv_recent/
      trust: 0.91
      enabled: true
    - name: feodotracker
      url: https://feodotracker.abuse.ch/downloads/ipblocklist.json
      trust: 0.93
      enabled: true
    - name: otx
      url: https://otx.alienvault.com/api/v1/pulses/subscribed
      trust: 0.90
      enabled: true
    - name: malwarebazaar
      url: https://mb-api.abuse.ch/api/v1/
      trust: 0.92
      enabled: true
    - name: phishtank
      url: https://data.phishtank.com/data/online-valid.json
      trust: 0.88
      enabled: true
    - name: talos_blog
      url: https://blog.talosintelligence.com/feed/
      trust: 0.68
      enabled: true
    - name: unit42_blog
      url: https://unit42.paloaltonetworks.com/feed/
      trust: 0.68
      enabled: true
    - name: securelist_blog
      url: https://securelist.com/feed/
      trust: 0.67
      enabled: true
    - name: crowdstrike_blog
      url: https://www.crowdstrike.com/blog/feed/
      trust: 0.67
      enabled: true
    - name: sentinelone_blog
      url: https://www.sentinelone.com/blog/feed/
      trust: 0.66
      enabled: true
    - name: rapid7_blog
      url: https://www.rapid7.com/blog/rss/
      trust: 0.66
      enabled: true
    - name: gbhackers_blog
      url: https://gbhackers.com/feed/
      trust: 0.64
      enabled: true

discovery:
  # Additive analyst-style discovery pass. Runs inside the pipeline only when
  # enabled; `sentinel discover` runs it standalone for tuning either way.
  enabled: true
  blocked_article_false_positive_threshold: 1
  blocked_host_false_positive_threshold: 2
  blocked_host_max_score: 0.35
  profiles:
    - name: crimeware-fresh
      enabled: true
      keywords:
        - ioc
        - iocs
        - indicators of compromise
        - c2
        - stealer
        - loader
        - ransomware
        - phishing
        - backdoor
        - malware
        - payload
        - hash
        - cve
      feeds:
        - https://blog.talosintelligence.com/feed/
        - https://unit42.paloaltonetworks.com/feed/
        - https://securelist.com/feed/
        - https://www.sentinelone.com/blog/feed/
        - https://gbhackers.com/feed/
      search_providers:
        - name: open_web_recent
          enabled: true
          provider: gdelt_doc
          base_url: https://api.gdeltproject.org/api/v2/doc/doc
          query_terms:
            - indicators of compromise
            - phishing
            - stealer
            - malware
          max_queries: 4
          max_records: 15
          sort: datedesc
        - name: open_web_google_news
          enabled: true
          provider: google_news_rss
          base_url: https://news.google.com/rss/search
          query_terms:
            - indicators of compromise
            - phishing
            - stealer
          max_queries: 3
          max_records: 10
      freshness_hours: 96
      max_candidates_per_source: 15
      max_pages_per_run: 6
      time_budget_seconds: 90
      per_page_timeout_seconds: 20
      require_ioc_section: true
      deny_hosts: []
      source_trust: 0.60

enrichment:
  virustotal_key: ${VT_API_KEY}
  shodan_key: ${SHODAN_API_KEY}
  abuseipdb_key: ${ABUSEIPDB_API_KEY}
  enable_whois: false
  provider_timeout_seconds: 20
  batch_size: 50
  max_iocs_per_run: 250
  weights:
    vt_ratio: 0.30
    abuse_confidence: 0.25
    source_trust: 0.10
    recency: 0.10
    context: 0.15
    corroboration: 0.10

crowdstrike:
  enabled: false
  client_id: ${CS_CLIENT_ID}
  client_secret: ${CS_CLIENT_SECRET}
  base_url: https://api.crowdstrike.com

delivery:
  telegram_token: ${TELEGRAM_BOT_TOKEN}
  telegram_chat_id: ${TELEGRAM_CHAT_ID}
  enable_telegram_immediate_alerts: true
  telegram_max_alerts_per_run: 3
  telegram_daily_digest_limit: 5
  telegram_digest_candidate_pool_size: 250
  enable_email: false
  sendgrid_key: ${SENDGRID_API_KEY}
  email_from: sentinel@yourdomain.com
  email_to:
    - analyst@yourdomain.com

anthropic:
  api_key: ${ANTHROPIC_API_KEY}
  model: claude-sonnet-4-20250514

openai:
  api_key: ${OPENAI_API_KEY}
  model: gpt-5.4
  base_url: ${OPENAI_BASE_URL}

mitre:
  stix_path: ${MITRE_STIX_PATH}

db:
  url: ${DATABASE_URL}
  redis_url: ${REDIS_URL}
  pool_pre_ping: true
  pool_recycle_seconds: 1800
  pool_size: 10
  max_overflow: 20

git:
  skills_repo_path: ./skills
  author_name: SENTINEL Learner
  author_email: sentinel@bot

karpathy:
  min_keep_delta: 0.01
  max_false_positive_increase: 0
  max_true_positive_drop: 0
  lease_ttl_seconds: 1800
  replay_window_hours: 336
  status_history_limit: 5
