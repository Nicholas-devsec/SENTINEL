[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel"
version = "0.2.0"
description = "SENTINEL: live IOC ingestion, writeup extraction, enrichment, detection generation, and a replay-evaluated self-improvement loop"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[project.scripts]
sentinel = "sentinel.cli:main"

[tool.setuptools]
packages = { find = { include = ["sentinel*"] } }

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
